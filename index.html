<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Portfólio de confeitaria artesanal — bolos personalizados feitos com carinho.">
<title>Portfólio da Confeiteira</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%A7%81</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Klee+One:wght@400;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

/* ==========================================================
   TOKENS — paleta kawaii japonena
   ========================================================== */
:root{
  --bg-cream:   #FFF8F3;
  --pink-sakura:#FFC2D6;
  --pink-bold:  #FF6FA0;
  --pink-deep:  #E14C82;
  --mint:       #BFEEDD;
  --lavender:   #E3D4F5;
  --gold:       #FFD873;
  --text-plum:  #4A2E3A;
  --text-soft:  #8A7480;
  --bg-galeria: #FFF0F6;
  --bg-contato: #F3F0FF;
}

/* ==========================================================
   RESET
   ========================================================== */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  font-family:'Nunito', sans-serif;
  color:var(--text-plum);
  background:var(--bg-cream);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; display:block; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
a{ text-decoration:none; color:inherit; }
h1,h2,h3{ line-height:1.15; }
:focus-visible{ outline:3px solid var(--pink-bold); outline-offset:3px; border-radius:6px; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* ==========================================================
   MARCA (canto superior)
   ========================================================== */
.mini-nav{
  position:fixed; top:0; left:0; z-index:50;
  padding:1rem clamp(1rem,4vw,2rem);
  font-family:'Fredoka',sans-serif; font-weight:600;
  font-size:clamp(.95rem,2vw,1.1rem);
  color:var(--pink-deep);
  pointer-events:none;
}

/* ==========================================================
   HERO — apresentação com foto de fundo em destaque
   ========================================================== */
.section-hero{
  position:relative;
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center;
  padding:6rem 1.25rem 4rem;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 15%, #FFEAF2 0%, transparent 45%),
    radial-gradient(circle at 85% 80%, #F1E8FF 0%, transparent 45%),
    var(--bg-cream);
}

.ambient-petals{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
.petal{
  position:absolute; top:-8%;
  border-radius:50% 0 50% 50%;
  background:linear-gradient(135deg, var(--pink-sakura), #ffffff);
  animation-name:fall; animation-timing-function:linear; animation-iteration-count:infinite;
}
@keyframes fall{
  0%{ transform:translateY(-10vh) translateX(0) rotate(0deg); opacity:0; }
  12%{ opacity:.85; }
  88%{ opacity:.85; }
  100%{ transform:translateY(115vh) translateX(var(--drift,20px)) rotate(360deg); opacity:0; }
}

/* ---------- docinhos animados ambientando o hero ---------- */
.ambient-sweets{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
.sweet-icon{
  position:absolute;
  transform-origin:center;
  filter:drop-shadow(0 4px 10px rgba(190,120,150,.28));
  animation-name:sweetBlink, sweetFloat;
  animation-timing-function:ease-in-out, ease-in-out;
  animation-iteration-count:infinite, infinite;
}
.sweet-icon svg{ width:100%; height:100%; display:block; }
@keyframes sweetBlink{
  0%,100%{ opacity:.3; }
  50%{ opacity:1; }
}
@keyframes sweetFloat{
  0%{ transform:translateY(0) rotate(var(--rot,-6deg)); }
  50%{ transform:translateY(-12px) rotate(calc(var(--rot,-6deg) * -1)); }
  100%{ transform:translateY(0) rotate(var(--rot,-6deg)); }
}

.hero-bg{ position:absolute; inset:0; z-index:0; overflow:hidden; }
.hero-bg svg, .hero-bg img{
  width:100%; height:100%; display:block; object-fit:cover;
  animation:kenburns 24s ease-in-out infinite alternate;
}
@keyframes kenburns{
  0%{ transform:scale(1.03) translate(0,0); }
  100%{ transform:scale(1.12) translate(-1.5%,-1%); }
}
.hero-scrim{
  position:absolute; inset:0; z-index:1;
  background:linear-gradient(180deg, rgba(255,248,243,.08) 0%, rgba(255,248,243,.5) 56%, rgba(255,248,243,.97) 100%);
}

.sparkle{ transform-box:fill-box; transform-origin:center; }
.sparkle-1{ animation:twinkle 1.7s ease-in-out infinite; }
.sparkle-2{ animation:twinkle 1.7s ease-in-out infinite .45s; }
.sparkle-3{ animation:twinkle 1.7s ease-in-out infinite .9s; }
@keyframes twinkle{ 0%,100%{ opacity:.15; transform:scale(.6); } 50%{ opacity:1; transform:scale(1); } }

.hero-content{
  position:relative; z-index:2;
  opacity:0; transform:translateY(20px);
  animation:heroIn .9s ease forwards;
}
.hero-content.d1{ animation-delay:.05s; }
.hero-content.d2{ animation-delay:.28s; }
.hero-content.d3{ animation-delay:.5s; }
.hero-content.d4{ animation-delay:.72s; }
@keyframes heroIn{ to{ opacity:1; transform:translateY(0); } }

.hero-name{
  font-family:'Fredoka',sans-serif; font-weight:700;
  font-size:clamp(2.1rem,7vw,3.8rem);
  color:var(--pink-deep);
  position:relative; z-index:2;
  text-shadow:3px 3px 0 #fff, 5px 5px 14px rgba(255,111,160,.2);
}
.hero-tagline{
  font-family:'Klee One',cursive;
  font-size:clamp(1.05rem,3vw,1.4rem);
  margin-top:.6rem; max-width:34ch;
  position:relative; z-index:2;
}
.hero-bio{
  margin-top:1.4rem; max-width:46ch;
  font-size:1.02rem; line-height:1.7; color:var(--text-soft);
  position:relative; z-index:2;
}

.hero-stat{
  margin-top:2rem; display:flex; flex-direction:column; align-items:center;
}
.hero-stat-number{
  font-family:'Fredoka',sans-serif; font-weight:700;
  font-size:clamp(3.2rem,11vw,5.4rem); line-height:1;
  background:linear-gradient(135deg, var(--pink-bold), var(--gold));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 14px rgba(255,111,160,.35));
}
.hero-stat-label{
  margin-top:.3rem; font-weight:800; font-size:.82rem;
  letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft);
}

.skills-chips{
  display:flex; flex-wrap:wrap; justify-content:center; gap:.55rem;
  max-width:620px; margin:1.9rem auto 0; position:relative; z-index:2;
}
.skill-chip{
  padding:.5rem 1.1rem; border-radius:999px;
  font-size:.88rem; font-weight:700; color:var(--text-plum);
  opacity:0; transform:translateY(10px) scale(.9);
  animation:chipIn .5s ease forwards;
}
@keyframes chipIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
.skill-chip:nth-child(6n+1){ background:var(--pink-sakura); }
.skill-chip:nth-child(6n+2){ background:var(--mint); }
.skill-chip:nth-child(6n+3){ background:var(--lavender); }
.skill-chip:nth-child(6n+4){ background:var(--gold); }
.skill-chip:nth-child(6n+5){ background:#FFD1E8; }
.skill-chip:nth-child(6n+6){ background:#D6F5E8; }

.scroll-cue{
  margin-top:2.2rem; font-size:.82rem; color:#B79AA6; position:relative; z-index:2;
  opacity:0;
  animation:cueBounce 1.8s ease-in-out infinite, cueFadeIn .6s ease forwards;
  animation-delay:0s, .95s;
}
@keyframes cueBounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(6px); } }
@keyframes cueFadeIn{ to{ opacity:1; } }

/* ==========================================================
   DIVISORES ONDULADOS
   ========================================================== */
.wave-divider{ display:block; line-height:0; }
.wave-divider svg{ display:block; width:100%; height:clamp(36px,7vw,80px); }
.wave-divider.flip{ transform:scaleY(-1); }

/* ==========================================================
   GALERIA — bolos, slider e "ver todas as fotos"
   ========================================================== */
.section-galeria{
  background:var(--bg-galeria);
  padding:4.5rem 1.25rem 5.5rem;
  text-align:center;
}
.section-title{
  font-family:'Fredoka',sans-serif; font-weight:700;
  font-size:clamp(1.7rem,5vw,2.6rem); color:var(--pink-deep);
}
.section-sub{
  font-family:'Klee One',cursive;
  color:var(--text-soft); margin-top:.5rem; font-size:1.02rem;
}

.slider{
  position:relative; max-width:1100px; margin:2.6rem auto 0;
  display:flex; align-items:center; gap:.6rem;
}
.slider-viewport{ overflow:hidden; flex:1; }
.slider-track{
  display:flex; touch-action:pan-y;
  transition:transform .5s cubic-bezier(.4,0,.2,1);
}
.slide{ flex:0 0 100%; padding:0 .5rem; transition:opacity .4s, transform .4s; }
@media (min-width:760px){ .slide{ flex-basis:60%; } }
@media (min-width:1080px){ .slide{ flex-basis:42%; } }
.slide:not(.is-active){ opacity:.4; transform:scale(.92); }

.cake-card{ background:#fff; border-radius:24px; overflow:hidden; box-shadow:0 16px 32px rgba(190,120,150,.18); }
.cake-visual{ aspect-ratio:4/3; width:100%; position:relative; display:flex; align-items:center; justify-content:center; }
.cake-visual img{ width:100%; height:100%; object-fit:cover; }
.cake-placeholder-svg{ width:70%; height:70%; }
.cake-placeholder-hint{
  position:absolute; bottom:.6rem; left:50%; transform:translateX(-50%);
  font-size:.68rem; background:rgba(255,255,255,.88); padding:.25rem .65rem;
  border-radius:999px; color:var(--text-soft); white-space:nowrap;
}
.cake-info{ padding:1rem 1.25rem 1.3rem; text-align:left; }
.cake-name{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.1rem; }
.cake-desc{ font-size:.88rem; color:var(--text-soft); margin-top:.25rem; }

.slider-arrow{
  flex-shrink:0; width:42px; height:42px; border-radius:50%;
  background:#fff; box-shadow:0 6px 16px rgba(190,120,150,.22);
  font-size:1.35rem; color:var(--pink-bold);
  display:flex; align-items:center; justify-content:center;
}
.slider-dots{ display:flex; justify-content:center; gap:.5rem; margin-top:1.4rem; }
.dot{ width:9px; height:9px; border-radius:50%; background:#F2CBDA; transition:all .3s; }
.dot.is-active{ background:var(--pink-bold); width:22px; border-radius:6px; }

.btn-ver-todas{
  margin-top:2.3rem; padding:.85rem 1.7rem; border-radius:999px;
  background:var(--pink-bold); color:#fff; font-weight:800; font-size:.98rem;
  box-shadow:0 10px 24px rgba(255,111,160,.35); transition:transform .2s;
}
.btn-ver-todas:hover{ transform:translateY(-3px) scale(1.03); }

/* ==========================================================
   LIGHTBOX
   ========================================================== */
.lightbox{
  position:fixed; inset:0; z-index:100;
  background:rgba(74,46,58,.92);
  display:flex; flex-direction:column;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.lightbox.is-open{ opacity:1; pointer-events:auto; }
.lightbox-header{ display:flex; justify-content:flex-end; padding:1rem 1.25rem; }
.lightbox-close{ width:42px; height:42px; border-radius:50%; background:#fff; font-size:1.2rem; color:var(--pink-deep); }

.lightbox-grid{
  flex:1; overflow-y:auto; padding:0 1.25rem 2rem;
  display:grid; grid-template-columns:repeat(2,1fr); gap:.85rem;
  max-width:1100px; margin:0 auto; width:100%;
}
@media (min-width:700px){ .lightbox-grid{ grid-template-columns:repeat(3,1fr); } }
@media (min-width:1000px){ .lightbox-grid{ grid-template-columns:repeat(4,1fr); } }
.lightbox-item{ border-radius:16px; overflow:hidden; aspect-ratio:1; background:#fff; padding:14%; }
.lightbox-item img{ width:100%; height:100%; object-fit:cover; }

.lightbox-single{ display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; padding:1rem 1.25rem 2rem; gap:1rem; }
.lightbox.is-single .lightbox-grid{ display:none; }
.lightbox.is-single .lightbox-single{ display:flex; }
.lightbox-single-visual{ max-width:520px; width:100%; aspect-ratio:4/3; border-radius:20px; overflow:hidden; background:#fff; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
.lightbox-single-visual img{ width:100%; height:100%; object-fit:cover; }
.lightbox-single-caption{ color:#fff; text-align:center; font-size:.95rem; max-width:40ch; }
.lightbox-single-nav{ display:flex; align-items:center; gap:1.2rem; }
.lightbox-single-nav button{ color:#fff; font-size:1rem; }
.lightbox-single-nav button:first-child, .lightbox-single-nav button:last-child{ font-size:1.6rem; }

/* ==========================================================
   CONTATO
   ========================================================== */
.section-contato{
  background:var(--bg-contato);
  padding:4.5rem 1.25rem 3.5rem;
  text-align:center; position:relative; overflow:hidden;
}
.floating-hearts{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.heart{ position:absolute; bottom:0; animation-name:floatUp; animation-timing-function:ease-in; animation-iteration-count:infinite; }
@keyframes floatUp{
  0%{ transform:translateY(10px); opacity:0; }
  15%{ opacity:.8; }
  85%{ opacity:.8; }
  100%{ transform:translateY(-260px); opacity:0; }
}

.contact-buttons{
  display:flex; flex-direction:column; align-items:center; gap:1rem;
  margin-top:2.2rem; position:relative; z-index:1;
}
@media (min-width:560px){ .contact-buttons{ flex-direction:row; justify-content:center; } }
.btn-contact{
  display:flex; align-items:center; gap:.65rem;
  padding:.95rem 1.7rem; border-radius:999px;
  font-weight:800; font-size:1rem; color:#fff;
  box-shadow:0 12px 26px rgba(0,0,0,.14); transition:transform .2s;
}
.btn-contact:hover{ transform:translateY(-4px) scale(1.03); }
.btn-contact.insta{ background:linear-gradient(135deg, #FFC2D6, #FF6FA0 55%, #C9A8F0); }
.btn-contact.whats{ background:linear-gradient(135deg, #BFEEDD, #57C9A0); color:var(--text-plum); }
.btn-contact svg{ width:21px; height:21px; flex-shrink:0; }

footer{ text-align:center; padding:1.8rem 1rem; background:var(--bg-contato); font-size:.82rem; color:var(--text-soft); }

/* ==========================================================
   REVEAL AO ROLAR
   ========================================================== */
.reveal{ opacity:0; transform:translateY(28px); transition:opacity .7s ease, transform .7s ease; }
.reveal.in-view{ opacity:1; transform:translateY(0); }

</style>
</head>
<body>

<header class="mini-nav">🧁 <span id="brandName"></span></header>

<!-- ==========================================================
     SEÇÃO 1 — APRESENTAÇÃO (sem fotos, só animação)
     ========================================================== -->
<section id="apresentacao" class="section-hero">

  <!-- Fundo em destaque: ilustração de bolo (troque por foto real em CONFIG.heroImagem) -->
  <div class="hero-bg" id="heroBg" aria-hidden="true">
    <svg viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
          <stop offset="0%" stop-color="#FFEAF2"/>
          <stop offset="55%" stop-color="#FFF3EC"/>
          <stop offset="100%" stop-color="#FCEBDC"/>
        </radialGradient>
        <linearGradient id="tierBottom" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFD3E2"/>
          <stop offset="100%" stop-color="#FFB0CC"/>
        </linearGradient>
        <linearGradient id="tierTop" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ECDEFA"/>
          <stop offset="100%" stop-color="#D6BEF0"/>
        </linearGradient>
        <linearGradient id="drip" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFE29A"/>
          <stop offset="100%" stop-color="#FFC94D"/>
        </linearGradient>
      </defs>

      <rect width="900" height="1200" fill="url(#bgGlow)"/>

      <!-- respingos de luz -->
      <circle cx="130" cy="220" r="95" fill="#FFD1E4" opacity=".35"/>
      <circle cx="770" cy="170" r="75" fill="#D9C2F0" opacity=".28"/>
      <circle cx="810" cy="730" r="115" fill="#BDEBD9" opacity=".22"/>
      <circle cx="80" cy="900" r="85" fill="#FFE39B" opacity=".22"/>

      <g class="sparkle sparkle-1"><path d="M170 360 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5Z" fill="#FFD873"/></g>
      <g class="sparkle sparkle-2"><path d="M715 330 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4Z" fill="#FF6FA0"/></g>
      <g class="sparkle sparkle-3"><path d="M745 630 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4Z" fill="#BFEEDD"/></g>

      <!-- sombra e suporte -->
      <ellipse cx="450" cy="962" rx="230" ry="32" fill="#E8536F" opacity=".12"/>
      <rect x="330" y="936" width="240" height="16" rx="8" fill="#FFF6F0" stroke="#F3CEDC" stroke-width="3"/>
      <rect x="420" y="952" width="60" height="14" fill="#F3CEDC"/>

      <!-- camada de baixo -->
      <rect x="270" y="762" width="360" height="188" rx="26" fill="url(#tierBottom)"/>
      <path d="M270,762 Q290,792 310,762 Q330,796 350,762 Q370,790 390,762 Q410,798 430,762 Q450,791 470,762 Q490,797 510,762 Q530,790 550,762 Q570,796 590,762 Q610,790 630,762 L630,745 L270,745 Z" fill="url(#drip)"/>

      <!-- rosáceas de confeitar -->
      <circle cx="350" cy="754" r="14" fill="#fff" opacity=".85"/>
      <circle cx="375" cy="754" r="14" fill="#fff" opacity=".85"/>
      <circle cx="400" cy="754" r="14" fill="#fff" opacity=".85"/>
      <circle cx="425" cy="754" r="14" fill="#fff" opacity=".85"/>
      <circle cx="450" cy="754" r="14" fill="#fff" opacity=".85"/>
      <circle cx="475" cy="754" r="14" fill="#fff" opacity=".85"/>
      <circle cx="500" cy="754" r="14" fill="#fff" opacity=".85"/>
      <circle cx="525" cy="754" r="14" fill="#fff" opacity=".85"/>
      <circle cx="550" cy="754" r="14" fill="#fff" opacity=".85"/>

      <!-- camada de cima -->
      <rect x="340" y="614" width="220" height="148" rx="22" fill="url(#tierTop)"/>
      <ellipse cx="450" cy="614" rx="110" ry="24" fill="#F2E7FC"/>

      <!-- morangos -->
      <ellipse cx="410" cy="597" rx="16" ry="20" fill="#E8536F"/>
      <circle cx="405" cy="590" r="2" fill="#fff" opacity=".6"/>
      <circle cx="415" cy="602" r="2" fill="#fff" opacity=".6"/>
      <path d="M410 577 l-6 -10 l6 4 l6 -4 Z" fill="#7FAE5C"/>

      <ellipse cx="450" cy="590" rx="17" ry="21" fill="#EF6B87"/>
      <circle cx="445" cy="582" r="2" fill="#fff" opacity=".6"/>
      <circle cx="456" cy="596" r="2" fill="#fff" opacity=".6"/>
      <path d="M450 568 l-6 -10 l6 4 l6 -4 Z" fill="#7FAE5C"/>

      <ellipse cx="492" cy="599" rx="15" ry="19" fill="#E8536F"/>
      <circle cx="487" cy="592" r="2" fill="#fff" opacity=".6"/>
      <path d="M492 580 l-6 -10 l6 4 l6 -4 Z" fill="#7FAE5C"/>

      <!-- lascas douradas -->
      <polygon points="368,614 376,608 380,616 372,620" fill="#FFD873"/>
      <polygon points="522,608 530,602 535,610 527,615" fill="#FFD873"/>
      <polygon points="430,572 436,567 440,574 433,578" fill="#FFD873"/>

      <!-- velinhas -->
      <rect x="395" y="547" width="8" height="40" rx="3" fill="#FF9FC0"/>
      <rect x="497" y="552" width="8" height="35" rx="3" fill="#B9E3D0"/>
      <circle cx="399" cy="530" r="16" fill="#FFEBB0" opacity=".4"/>
      <circle cx="501" cy="535" r="16" fill="#FFEBB0" opacity=".4"/>
      <path d="M399 547 q-6 -14 0 -22 q6 8 0 22Z" fill="#FFD873"/>
      <path d="M501 552 q-6 -14 0 -22 q6 8 0 22Z" fill="#FFD873"/>
    </svg>
  </div>
  <div class="hero-scrim" aria-hidden="true"></div>
  <div class="ambient-petals" id="ambientPetals" aria-hidden="true"></div>
  <div class="ambient-sweets" id="ambientSweets" aria-hidden="true"></div>

  <h1 class="hero-name hero-content d1" id="heroName"></h1>
  <p class="hero-tagline hero-content d2" id="heroTagline"></p>
  <p class="hero-bio hero-content d3" id="heroBio"></p>

  <div class="hero-stat hero-content d4" id="heroStat">
    <span class="hero-stat-number" id="heroStatNumber">0</span>
    <span class="hero-stat-label" id="heroStatLabel"></span>
  </div>

  <div class="skills-chips" id="skillsChips"></div>

  <p class="scroll-cue">role para ver os bolos ↓</p>
</section>

<div class="wave-divider" aria-hidden="true">
  <svg viewBox="0 0 1440 100" preserveAspectRatio="none"><path d="M0,40 C240,100 480,0 720,40 C960,80 1200,20 1440,50 L1440,100 L0,100 Z" fill="#FFF0F6"/></svg>
</div>

<!-- ==========================================================
     SEÇÃO 2 — GALERIA DE BOLOS
     ========================================================== -->
<section id="galeria" class="section-galeria">
  <h2 class="section-title reveal">Meus bolos ✨</h2>
  <p class="section-sub reveal">Cada criação tem uma história — e um pouquinho de mágica</p>

  <div class="slider reveal" id="slider">

/* ==========================================================
   SLIDER
   ========================================================== */
let sliderIndex = 0;
let sliderTimer = null;

function renderSlider(){
  const track = document.getElementById('sliderTrack');
  const dots  = document.getElementById('sliderDots');

  track.innerHTML = CONFIG.bolos.map((bolo,i) => `
    <div class="slide" data-index="${i}">
      <div class="cake-card">
        <div class="cake-visual" style="background:${bolo.imagem ? '#fff' : bolo.cor + '26'}">
          ${bolo.imagem
            ? `<img src="${bolo.imagem}" alt="${bolo.nome}" loading="lazy">`
            : cakePlaceholderSVG(bolo.cor) + '<span class="cake-placeholder-hint">📸 adicione a foto real aqui</span>'}
        </div>
        <div class="cake-info">
          <p class="cake-name">${bolo.nome}</p>
          <p class="cake-desc">${bolo.descricao}</p>
        </div>
      </div>
    </div>
  `).join('');

  dots.innerHTML = CONFIG.bolos.map((_,i) =>
    `<button class="dot" type="button" data-index="${i}" aria-label="Ir para foto ${i+1}"></button>`
  ).join('');

  document.querySelectorAll('.dot').forEach(dot => {
    dot.addEventListener('click', () => goToSlide(parseInt(dot.dataset.index, 10)));
  });
  document.querySelector('.slider-arrow.left').addEventListener('click', () => goToSlide(sliderIndex - 1));
  document.querySelector('.slider-arrow.right').addEventListener('click', () => goToSlide(sliderIndex + 1));

  initSliderTouch();
  updateSlider();
  startAutoplay();
  window.addEventListener('resize', updateSlider);
}

function goToSlide(i){
  const total = CONFIG.bolos.length;
  sliderIndex = (i + total) % total;
  updateSlider();
  restartAutoplay();
}

function updateSlider(){
  const track  = document.getElementById('sliderTrack');
  const slides = track.querySelectorAll('.slide');
  const active = track.querySelector(`.slide[data-index="${sliderIndex}"]`);

  slides.forEach(s => s.classList.remove('is-active'));
  if (active) active.classList.add('is-active');

  const viewport = track.parentElement;
  const offset = active ? (active.offsetLeft - (viewport.clientWidth - active.clientWidth) / 2) : 0;
  track.style.transform = `translateX(-${offset}px)`;

  document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('is-active', i === sliderIndex));
}

function startAutoplay(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  sliderTimer = setInterval(() => goToSlide(sliderIndex + 1), 5000);
}
function restartAutoplay(){ clearInterval(sliderTimer); startAutoplay(); }

function initSliderTouch(){
  const track = document.getElementById('sliderTrack');
  let startX = 0, tracking = false;
  track.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX; tracking = true; clearInterval(sliderTimer);
  }, { passive:true });
  track.addEventListener('touchend', e => {
    if (!tracking) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (dx > 50) goToSlide(sliderIndex - 1);
    else if (dx < -50) goToSlide(sliderIndex + 1);
    else restartAutoplay();
    tracking = false;
  });
}

let lightboxIndex = 0;

function initLightbox(){
  document.getElementById('lightboxGrid').innerHTML = CONFIG.bolos.map((b,i) => `

      ${b.imagem ? `<img src="${b.imagem}" alt="${b.nome}" loading="lazy">` : cakePlaceholderSVG(b.cor)}
    </button>
  `).join('');

  document.querySelectorAll('.lightbox-item').forEach(btn => {
    btn.addEventListener('click', () => openSingle(parseInt(btn.dataset.index, 10)));
  });

  document.getElementById('btnVerTodas').addEventListener('click', openLightboxGrid);
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target.id === 'lightbox') closeLightbox();
  });
  document.getElementById('lightboxBackGrid').addEventListener('click', () => {
    document.getElementById('lightbox').classList.remove('is-single');
  });
  document.getElementById('lightboxPrev').addEventListener('click', () => openSingle(lightboxIndex - 1));
  document.getElementById('lightboxNext').addEventListener('click', () => openSingle(lightboxIndex + 1));

  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('is-open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') openSingle(lightboxIndex + 1);
    if (e.key === 'ArrowLeft') openSingle(lightboxIndex - 1);
  });
}

function openLightboxGrid(){
  const lb = document.getElementById('lightbox');
  lb.classList.add('is-open');
  lb.classList.remove('is-single');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('is-open');
  document.body.style.overflow = '';
}
function openSingle(i){
  const total = CONFIG.bolos.length;
  lightboxIndex = (i + total) % total;
  const bolo = CONFIG.bolos[lightboxIndex];

  document.getElementById('lightboxSingleVisual').innerHTML = bolo.imagem
    ? `<img src="${bolo.imagem}" alt="${bolo.nome}">`
    : cakePlaceholderSVG(bolo.cor);
  document.getElementById('lightboxSingleCaption').textContent = `${bolo.nome} — ${bolo.descricao}`;

  const lb = document.getElementById('lightbox');
  lb.classList.add('is-open', 'is-single');
  document.body.style.overflow = 'hidden';
}

/* ==========================================================
   REVELAR AO ROLAR + CONTADOR
   ========================================================== */
function initReveal(){
  const items = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting){
        entry.target.classList.add('in-view');
        if (entry.target.classList.contains('stat-badge')){
          animateCount(entry.target.querySelector('.stat-number'));
        }
        io.unobserve(entry.target);
      }
    });
  }, { threshold:.3 });
  items.forEach(el => io.observe(el));
}

function animateCount(el){
  const target = parseInt(el.dataset.target, 10);
  const suffix = el.dataset.suffix || '';
  if (isNaN(target)) return;
  let cur = 0;
  const step = Math.max(1, Math.round(target/30));
  const tick = () => {
    cur += step;
    if (cur >= target){ el.textContent = target + suffix; return; }
    el.textContent = cur + suffix;
    requestAnimationFrame(tick);
  };
  tick();
}
